name: deenbook
description: دفتر الأمانة لإدارة الذمم المالية للمحلات.
publish_to: none
version: 1.1.2+4
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: any
  dio: ^5.11.1
  flutter_secure_storage: ^10.0.0
  uuid: ^4.5.3
  url_launcher: ^6.3.2
  speech_to_text: ^7.3.0
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^12.0.0
  cross_file: ^0.3.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: Money
      fonts:
        - asset: assets/fonts/Money.ttf
          weight: 700
